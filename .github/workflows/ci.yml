name: CI

on:
  push:
    branches: [master, agent/continuity]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run continuity -- public/sample-data --dry-run
      - run: npm test
      - run: npm run validate:continuity
      - run: npm run build
      - run: npm run lint
